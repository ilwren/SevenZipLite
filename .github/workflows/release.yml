name: Release

# 触发条件 / Trigger:
#   推送形如 v1.2.3 / v1.2.3-rc.1 的 tag 时自动运行。
#   Runs automatically when a tag matching v1.2.3 / v1.2.3-rc.1 is pushed.
#
# 产物 / Artifacts published to the GitHub Release:
#   - SevenZipLite.Native.<version>.nupkg (NuGet 包 / NuGet package)
#   - SevenZipLite.AvaloniaDemo-win-x64.zip   (Native AOT，单文件原生可执行文件)
#   - SevenZipLite.AvaloniaDemo-linux-x64.zip (Native AOT, single-file native executable)
#   - SevenZipLite.MauiDemo.apk           (未签名 / unsigned)
#   注意：.snupkg（符号包）不会附加到 GitHub Release——它只在 publish-nuget-org job 里
#   随 .nupkg 一起推送到 nuget.org 的符号服务器，不是终端用户下载的产物。
#   Note: .snupkg (symbol package) is NOT attached to the GitHub Release — it's only
#   pushed to nuget.org's symbol server alongside the .nupkg in the publish-nuget-org
#   job; it isn't an end-user-facing download.
#
# 每次发布都保证是一个全新的 GitHub Release / Every release is guaranteed to be fresh:
#   create-release job 在创建 Release 前会先删除同一个 tag 下任何已存在的旧 Release
#   （只删 Release 本身，不动 tag），因此不会出现"复用旧 Release、只改标题/追加文件"
#   的情况（这是 softprops/action-gh-release 对同一 tag_name 的默认"创建或更新"语义）。
#   The create-release job deletes any pre-existing Release for the same tag before
#   creating a new one (only the Release object, not the tag), so it never ends up
#   reusing an old Release and just editing its title / appending files to it (which is
#   softprops/action-gh-release's default "create-or-update" behavior for a given
#   tag_name).
#
# nuget.org 发布 / nuget.org publish:
#   自动按每个 tag 触发（见 publish-nuget-org job），走 nuget.org 推荐的 Trusted
#   Publishing（OIDC 换取 1 小时有效的临时 API Key，不使用长期有效的 API Key secret）。
#   只有当仓库 Secrets 里配置了 NUGET_USERNAME 时才会真正推送；没配置时该 job 会正常
#   跳过（不报错，GitHub Release 仍会照常发布），并在 Job Summary 里写明跳过原因和
#   配置方法。
#   Automatically triggered on every tag (see the publish-nuget-org job), using
#   nuget.org's recommended Trusted Publishing (OIDC exchanged for a 1-hour-lived
#   temporary API key — no long-lived API key secret involved). Only actually pushes
#   when the NUGET_USERNAME secret is configured in the repo; when it isn't, the job
#   cleanly skips (no failure, the GitHub Release still gets published), and the Job
#   Summary records why it was skipped and how to configure it.


on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 1.0.0）/ Version (without leading v, e.g. 1.0.0)"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ---------------------------------------------------------------------
  # 1. 提取版本号 / Resolve the version number used by every other job.
  # ---------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # 2. Linux 自测：正确性 + 多线程压力测试，作为发布前质量门槛。
  #    Linux self-tests: correctness + multi-threading stress test, gating the release.
  # ---------------------------------------------------------------------
  test-linux:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "Run self-test (21 correctness cases: format/split/password matrix + async/progress/cancellation)"
        run: dotnet run --project tests/SevenZipLite.Tests -c Release

      - name: Run multi-threading stress test
        run: dotnet run --project tests/SevenZipLite.Tests -c Release -- --stress

  # ---------------------------------------------------------------------
  # 3. Native AOT 兼容性冒烟测试：把 tests/SevenZipLite.AotSmokeTest 发布成真正的
  #    Native AOT 原生可执行文件后再实际运行一遍，验证 COM 互操作 / P-Invoke 字符串
  #    编组在 Native AOT 运行时下也是正确的——src/SevenZipLite/SevenZipLite.csproj 里的
  #    <IsAotCompatible> 只是编译期静态分析（trim/AOT analyzer 0 警告），不能代替这一步
  #    真正把原生产物跑起来的运行时验证（vtable 布局错位这类问题，静态分析是看不出来的）。
  #    不依赖任何上游 job 的产物，只需要 setup 解析出的版本号上下文，因此和 test-linux
  #    并行执行，不拖慢整体发布流程。
  #
  #    Native AOT compatibility smoke test: publish tests/SevenZipLite.AotSmokeTest as a
  #    real Native AOT executable and actually run it, to verify COM interop / P-Invoke
  #    string marshalling are also correct under the Native AOT runtime —
  #    src/SevenZipLite/SevenZipLite.csproj's <IsAotCompatible> is only a compile-time
  #    static-analysis opt-in (0 warnings from the trim/AOT analyzer) and can't replace
  #    this runtime check against the actual native output (things like COM vtable
  #    layout mismatches are invisible to static analysis). Doesn't depend on any
  #    upstream job's artifacts, just the version context resolved by setup, so it runs
  #    in parallel with test-linux without slowing down the overall release.
  # ---------------------------------------------------------------------
  verify-aot:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish AOT smoke test (linux-x64)
        run: >
          dotnet publish tests/SevenZipLite.AotSmokeTest/SevenZipLite.AotSmokeTest.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishAot=true
          -o publish/aot-smoke-test

      - name: Run AOT smoke test
        run: ./publish/aot-smoke-test/SevenZipLite.AotSmokeTest

  # ---------------------------------------------------------------------
  # 4. 打包 NuGet 包 / Pack the NuGet package.
  # ---------------------------------------------------------------------
  pack-nuget:
    runs-on: ubuntu-latest
    needs: [setup, test-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack SevenZipLite.Native
        run: |
          chmod +x scripts/pack-nuget.sh
          ./scripts/pack-nuget.sh "${{ needs.setup.outputs.version }}" ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 5. 发布 Avalonia Demo（win-x64 / linux-x64，Native AOT）
  #    / Publish the Avalonia demo (win-x64 / linux-x64, Native AOT).
  # ---------------------------------------------------------------------
  publish-avalonia:
    # 只发布 win-x64 和 linux-x64 两个 RID，不含 win-x86——.NET Native AOT 从根上就不
    # 支持 32 位 Windows（ilc 代码生成器只覆盖 Windows x64/arm64），`dotnet publish -r
    # win-x86 -p:PublishAot=true` 会直接报 NETSDK1203 "Ahead-of-time compilation is not
    # supported for the target runtime identifier 'win-x86'."，这是 .NET SDK 的硬限制，
    # 不是本项目配置问题，也没有绕过办法；真实跑过一次 CI 才验证到这一点（本地沙箱没有
    # Windows 环境，无法提前发现）。如果需要给 win-x86 用户提供本库的归档能力，应直接让
    # 他们引用 NuGet 包 `SevenZipLite.Native`（支持 win-x86，只是不能以 Native AOT
    # 方式发布可执行文件），而不是试图让这个 Demo 覆盖 win-x86。
    #
    # Only win-x64 and linux-x64 are published — not win-x86. .NET Native AOT
    # fundamentally doesn't support 32-bit Windows (the ilc code generator only covers
    # Windows x64/arm64); `dotnet publish -r win-x86 -p:PublishAot=true` fails outright
    # with NETSDK1203 "Ahead-of-time compilation is not supported for the target runtime
    # identifier 'win-x86'." This is a hard .NET SDK limitation, not a misconfiguration
    # in this project, and there's no workaround — it only surfaced after an actual CI
    # run (the local sandbox has no Windows environment to catch it ahead of time). If
    # win-x86 users need this library's archive functionality, point them at the
    # `SevenZipLite.Native` NuGet package directly (it does support win-x86, just not as
    # a Native AOT-published executable) rather than trying to make this demo cover
    # win-x86.
    #
    # 每个 RID 配对到它原生对应的 Runner OS，而不是让某个 Runner 去跨平台发布别的 RID
    # ——Native AOT 的代码生成器（ilc）不支持跨操作系统编译，在 Linux 上发布 win-x64、
    # 或在 Windows 上发布 linux-x64 都会失败。两个 RID 天然对应两种 Runner OS，matrix
    # 里按 RID 配好对应的 os 即可，不需要额外的跨平台处理。
    #
    # Each RID is paired with its own native Runner OS rather than having one runner
    # cross-publish another RID — Native AOT's code generator (ilc) does not support
    # cross-OS compilation; publishing win-x64 on Linux, or linux-x64 on Windows, would
    # fail. The two RIDs naturally map to two runner OSes, so the matrix just pairs each
    # RID with its OS — no extra cross-platform handling needed.
    runs-on: ${{ matrix.os }}
    needs: setup
    strategy:
      # fail-fast: false —— 两个 RID 互相独立，一个失败不应该连带取消其它正在跑的 job。
      # fail-fast: false — the two RIDs are independent; one failing shouldn't cancel
      # the other still-running job.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 这个 Avalonia 项目没有声明 <Platforms>/<PlatformTarget>（跟之前 WPF Demo 不
      # 一样），所以不会重现当年 win-x86 那个 "RuntimeIdentifier platform 'win-x86'
      # and the PlatformTarget 'x64' must be compatible." 的 NETSDK1032 问题（这是另一个
      # 不同的、已经绕开的坑；本 job 不发布 win-x86 的原因是上面提到的 NETSDK1203，两者
      # 不是同一个问题）。PublishAot=true 已经写死在 csproj 里（不区分 Configuration），
      # 这里仍显式传一遍只是为了让这一步本身自解释。
      #
      # This Avalonia project declares no <Platforms>/<PlatformTarget> (unlike the old
      # WPF demo), so it can't reproduce the old win-x86 NETSDK1032 "RuntimeIdentifier
      # platform 'win-x86' and the PlatformTarget 'x64' must be compatible." bug (that
      # was a different, already-sidestepped issue; this job excludes win-x86 for the
      # separate NETSDK1203 reason noted above). PublishAot=true is already hardcoded in
      # the csproj (not conditioned on Configuration); it's still passed explicitly
      # below purely so this step is self-documenting.
      - name: Publish Avalonia demo (${{ matrix.rid }}, Native AOT)
        run: >
          dotnet publish samples/SevenZipLite.AvaloniaDemo/SevenZipLite.AvaloniaDemo.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.setup.outputs.version }}
          -p:PublishAot=true
          -o publish/${{ matrix.rid }}

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath SevenZipLite.AvaloniaDemo-${{ matrix.rid }}.zip

      - name: Zip artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "../../SevenZipLite.AvaloniaDemo-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-demo-${{ matrix.rid }}
          path: SevenZipLite.AvaloniaDemo-${{ matrix.rid }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 6. 构建 MAUI (Android) Demo APK / Build the MAUI (Android) demo APK.
  # ---------------------------------------------------------------------
  build-maui:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android APK (unsigned Release)
        run: >
          dotnet build samples/SevenZipLite.MauiDemo/SevenZipLite.MauiDemo.csproj
          -f net10.0-android -c Release
          -p:Version=${{ needs.setup.outputs.version }}
          -p:AndroidPackageFormat=apk

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk_path=$(find samples/SevenZipLite.MauiDemo -iname "*.apk" | head -n 1)
          echo "找到 / found: $apk_path"
          cp "$apk_path" SevenZipLite.MauiDemo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: maui-demo-apk
          path: SevenZipLite.MauiDemo.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 7. 创建 GitHub Release 并附上所有产物 / Create the GitHub Release with all assets.
  # ---------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    # verify-aot 不产出任何制品（没有要下载/打包进 Release 的文件），但它的通过与否
    # 仍然作为发布质量门槛之一：加进 needs 列表能让它失败时连带阻止 create-release，
    # 而不是静默跳过检查。
    # verify-aot produces no artifacts (nothing to download/bundle into the Release),
    # but whether it passes is still one of the release's quality gates: including it
    # in needs means its failure blocks create-release too, instead of being silently
    # ignored.
    needs: [setup, verify-aot, pack-nuget, publish-avalonia, build-maui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release-assets
          # 注意：.snupkg（符号包）不放进 GitHub Release 附件——它是给符号服务器用的
          # 调试符号包（配合 `dotnet nuget push` 推送 .nupkg 时会自动一并推送同目录下的
          # .snupkg 到 nuget.org 的符号服务器，见下面 publish-nuget-org job），不是给
          # 终端用户下载的产物，放进 Release 里只会造成困惑/占地方。
          # Note: .snupkg (symbol package) is intentionally NOT attached to the GitHub
          # Release — it's a debug-symbol package meant for a symbol server (when
          # `dotnet nuget push` pushes the .nupkg, it automatically also pushes the
          # matching .snupkg in the same directory to nuget.org's symbol server, see the
          # publish-nuget-org job below). It's not an end-user-facing artifact, so
          # attaching it to the Release would just be confusing clutter.
          find downloaded -type f \( -name "*.nupkg" -o -name "*.zip" -o -name "*.apk" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Delete pre-existing release for this tag (if any)
        # softprops/action-gh-release 对同一个 tag_name 是"创建或更新"语义：如果这个
        # tag 已经有一个 Release 了（比如之前手动跑过一次、或者重新 dispatch 了同一个
        # 版本号重跑整个 workflow），它不会创建一个全新的 Release，而是复用旧的那个，
        # 只更新 name/body，并把这次的新文件追加进旧 Release 原有的附件列表——不会清掉
        # 上次遗留的文件，导致看起来像是"每次发布都在已有 Release 基础上改标题、加文件"
        # 而不是真正的全新发布。这里显式地先把同 tag 的旧 Release（如果存在）删掉，
        # 只删 Release 本身，不加 --cleanup-tag，不动 tag，这样下一步
        # action-gh-release 面对的永远是"这个 tag 还没有 Release"的干净状态，必然创建
        # 一个全新的 Release，而不是误改旧的。找不到旧 Release 时 `gh release delete`
        # 会以非零退出码失败，用 `|| true` 吞掉即可（首次发布某个 tag 时本来就不存在
        # 旧 Release，这是正常情况，不是错误）。
        #
        # softprops/action-gh-release has "create-or-update" semantics keyed on
        # tag_name: if a Release already exists for this tag (e.g. a previous manual
        # run, or re-dispatching the same version to re-run the whole workflow), it
        # does NOT create a brand-new Release — it reuses the old one, only updating
        # name/body, and appends this run's files onto the old Release's existing asset
        # list without clearing anything left over from last time. That's exactly why
        # it can look like "every publish just edits the title and adds files to an
        # existing Release" instead of being a genuinely fresh release. This step
        # explicitly deletes any pre-existing Release for the same tag first (deleting
        # only the Release object, not the tag itself — no --cleanup-tag — so the tag
        # stays untouched), guaranteeing the next step always sees a clean "no Release
        # for this tag yet" state and therefore always creates a truly new Release
        # instead of silently mutating an old one. `gh release delete` exits non-zero
        # when there's nothing to delete, which is swallowed with `|| true` (there's
        # naturally no pre-existing Release the first time a given tag is published —
        # that's expected, not an error).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SevenZipLite v${{ needs.setup.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(needs.setup.outputs.version, '-') }}

  # ---------------------------------------------------------------------

  # 8. 推送到 nuget.org（Trusted Publishing / OIDC，不用长期有效的 API Key）
  #    Push to nuget.org (Trusted Publishing / OIDC, no long-lived API key).
  #
  #    nuget.org 官方已经明确不建议自动化发布继续用 API Key（哪怕是 glob-pattern 限定、
  #    有过期时间的那种），推荐改用 Trusted Publishing：工作流运行时用 GitHub 签发的
  #    OIDC token 去 nuget.org 换一个只活 1 小时的临时 API Key，没有长期凭据可以被偷/
  #    泄露，也不用手动轮换。这里用的就是 nuget.org 官方的 `NuGet/login@v1` action 做
  #    这个换取过程。
  #    nuget.org officially discourages using API keys for automated publishing (even
  #    scoped/short-lived ones) and recommends Trusted Publishing instead: the workflow
  #    run exchanges a GitHub-issued OIDC token for a temporary nuget.org API key that
  #    only lives for 1 hour — no long-lived credential to leak or rotate. This job uses
  #    nuget.org's own `NuGet/login@v1` action to do that exchange.
  #
  #    只有仓库 Secrets 中配置了 NUGET_USERNAME（你的 nuget.org 用户名，不是邮箱）才会
  #    真正执行推送；没配置时这个 job 仍会运行，但会在 Job Summary 里明确提示"跳过"，
  #    而不是报错——这样还没配置好 Trusted Publishing 的仓库也能正常走完整个 Release
  #    流程，不会卡住。
  #    Only actually pushes when the NUGET_USERNAME secret (your nuget.org username, not
  #    email) is configured in the repo. When it isn't, this job still runs but clearly
  #    summarizes that it was skipped instead of failing — so a repo that hasn't set up
  #    Trusted Publishing yet can still complete the whole Release flow without getting
  #    stuck.
  #
  #    如何启用 / How to enable:
  #      1. 登录 nuget.org -> 右上角用户名 -> Trusted Publishing -> Add / Create，
  #         填写（大小写不敏感）：
  #         Sign in to nuget.org -> username menu -> Trusted Publishing -> Add / Create,
  #         fill in (case-insensitive):
  #           - Repository Owner: 你的 GitHub 用户名或组织名 / your GitHub username or org
  #           - Repository: 本仓库名（如 SevenZipLite）/ this repo's name (e.g. SevenZipLite)
  #           - Workflow File: release.yml（只填文件名，不带 .github/workflows/ 路径）
  #             release.yml (file name only, not the .github/workflows/ path)
  #           - Environment: 留空（本 job 没有用 GitHub Environments）
  #             leave empty (this job doesn't use a GitHub Environment)
  #      2. 仓库 Settings -> Secrets and variables -> Actions -> New repository
  #         secret，名字必须是 `NUGET_USERNAME`，值填你的 nuget.org 用户名（是个人资料
  #         页显示的那个用户名/个人或组织账号名，不是登录邮箱）。这个值本身不是什么
  #         敏感凭据，用 secret 存只是避免在 workflow 文件里明文写用户名、方便以后改。
  #         Repo Settings -> Secrets and variables -> Actions -> New repository secret,
  #         name it exactly `NUGET_USERNAME`, value is your nuget.org username (the one
  #         shown on your profile page, not your login email). The value itself isn't a
  #         sensitive credential — storing it as a secret just avoids hardcoding it in
  #         the workflow file and makes it easy to change later.
  #      3. 配置好之后无需改动这个 workflow 文件，下一次打 tag 触发 Release 时就会自动
  #         用 OIDC 换临时 Key 并推送；之前已经发布过、没配置好 Trusted Publishing 的
  #         那些 tag 不会被补推。如果之前配置过旧的 NUGET_API_KEY secret，现在可以从
  #         仓库 Secrets 里删掉了（已经不再被这个 workflow 使用）。
  #         No workflow changes needed after that — the next tag-triggered Release will
  #         automatically exchange for a temp key via OIDC and push. Tags already
  #         released before Trusted Publishing was configured are not retroactively
  #         pushed. If you previously configured the old NUGET_API_KEY secret, you can
  #         delete it from the repo now — this workflow no longer uses it.
  #
  #    注意：job 级（以及 step 级）的 `if:` 条件不允许直接引用 `secrets` 上下文
  #    （GitHub Actions 会在工作流校验阶段报错 "Unrecognized named-value: 'secrets'"，
  #    导致整个工作流文件判定为不合法，一个 job 都跑不起来）。`secrets` 只能出现在
  #    `env:`/`with:` 里。因此这里改用：job 本身总是被调度，但第一步先把 secret 读进
  #    普通 env 变量、判断是否为空并写入 step output，后续步骤的 `if:` 只依赖这个
  #    step output（不是 `secrets` 上下文），从而绕开这个限制。
  #
  #    Note: job-level (and step-level) `if:` conditions cannot directly reference the
  #    `secrets` context (GitHub Actions rejects it at workflow-validation time with
  #    "Unrecognized named-value: 'secrets'", which fails the *entire* workflow file
  #    before any job runs). `secrets` may only appear inside `env:`/`with:`. So this
  #    job always gets scheduled, but its first step reads the secret into a plain env
  #    var, checks whether it's empty, and writes a step output; subsequent steps'
  #    `if:` conditions only depend on that step output (not the `secrets` context),
  #    sidestepping the restriction.
  # ---------------------------------------------------------------------
  publish-nuget-org:
    runs-on: ubuntu-latest
    needs: [setup, pack-nuget, create-release]
    permissions:
      # Trusted Publishing 必需：让 GitHub 给这个 job 签发 OIDC token，NuGet/login
      # 用它去 nuget.org 换临时 API Key。这个 job 不需要 checkout 仓库内容，所以不用
      # 额外加 contents 权限。
      # Required for Trusted Publishing: lets GitHub issue an OIDC token for this job,
      # which NuGet/login exchanges for a temporary nuget.org API key. This job doesn't
      # checkout repo content, so no extra `contents` permission is needed.
      id-token: write
    steps:
      - name: Check whether NUGET_USERNAME is configured
        id: check
        env:
          NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
        run: |
          if [ -n "$NUGET_USERNAME" ]; then
            echo "has_user=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_user=false" >> "$GITHUB_OUTPUT"
            echo "NUGET_USERNAME secret 未配置，跳过 nuget.org 推送 / NUGET_USERNAME secret not set, skipping nuget.org push"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.has_user == 'true'
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.has_user == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: NuGet login (OIDC -> temp API key)
        if: steps.check.outputs.has_user == 'true'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push to nuget.org
        if: steps.check.outputs.has_user == 'true'
        env:
          TEMP_NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$TEMP_NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.has_user }}" = "true" ]; then
            {
              echo "### 📦 nuget.org 推送 / nuget.org push";
              echo "";
              echo "已通过 Trusted Publishing（OIDC，无长期 API Key）推送 \`SevenZipLite.Native\`"
              echo "版本 \`${{ needs.setup.outputs.version }}\` 到 nuget.org（含配套的 .snupkg 符号包）。";
              echo "";
              echo "Pushed \`SevenZipLite.Native\` version \`${{ needs.setup.outputs.version }}\` to";
              echo "nuget.org via Trusted Publishing (OIDC, no long-lived API key), along with its";
              echo "matching .snupkg symbol package.";
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⏭️ nuget.org 推送已跳过 / nuget.org push skipped";
              echo "";
              echo "仓库 Secrets 未配置 \`NUGET_USERNAME\`（Trusted Publishing 所需），本次只";
              echo "发布了 GitHub Release，没有推送到 nuget.org。配置方法见 release.yml 里";
              echo "publish-nuget-org job 的注释。";
              echo "";
              echo "Repo secret \`NUGET_USERNAME\` (required for Trusted Publishing) is not";
              echo "configured, so only the GitHub Release was published this time — nothing";
              echo "was pushed to nuget.org. See the comment on the publish-nuget-org job in";
              echo "release.yml for setup steps.";
            } >> "$GITHUB_STEP_SUMMARY"
          fi
