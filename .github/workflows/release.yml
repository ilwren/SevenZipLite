name: Release

# 触发条件 / Trigger:
#   推送形如 v1.2.3 / v1.2.3-rc.1 的 tag 时自动运行。
#   Runs automatically when a tag matching v1.2.3 / v1.2.3-rc.1 is pushed.
#
# 产物 / Artifacts published to the GitHub Release:
#   - SevenZipLite.Native.<version>.nupkg / .snupkg  (NuGet 包 / NuGet package)
#   - SevenZipLite.WpfDemo-win-x64.zip
#   - SevenZipLite.WpfDemo-win-x86.zip
#   - SevenZipLite.MauiDemo.apk           (未签名 / unsigned)
#
# nuget.org 发布 / nuget.org publish:
#   默认关闭。只有当仓库 Secrets 里配置了 NUGET_API_KEY 时才会执行推送。
#   Disabled by default. Only runs if NUGET_API_KEY is configured in repo Secrets.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 1.0.0）/ Version (without leading v, e.g. 1.0.0)"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ---------------------------------------------------------------------
  # 1. 提取版本号 / Resolve the version number used by every other job.
  # ---------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # 2. Linux 自测：正确性 + 多线程压力测试，作为发布前质量门槛。
  #    Linux self-tests: correctness + multi-threading stress test, gating the release.
  # ---------------------------------------------------------------------
  test-linux:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run self-test (13 correctness cases)
        run: dotnet run --project tests/SevenZipLite.Tests -c Release

      - name: Run multi-threading stress test
        run: dotnet run --project tests/SevenZipLite.Tests -c Release -- --stress

  # ---------------------------------------------------------------------
  # 3. 打包 NuGet 包 / Pack the NuGet package.
  # ---------------------------------------------------------------------
  pack-nuget:
    runs-on: ubuntu-latest
    needs: [setup, test-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack SevenZipLite.Native
        run: |
          chmod +x scripts/pack-nuget.sh
          ./scripts/pack-nuget.sh "${{ needs.setup.outputs.version }}" ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 4. 发布 WPF Demo（win-x64 / win-x86）/ Publish the WPF demo.
  # ---------------------------------------------------------------------
  publish-wpf:
    runs-on: windows-latest
    needs: setup
    strategy:
      # fail-fast: false —— 两个 RID（win-x64/win-x86）互相独立，一个失败不应该连带取消
      # 另一个正在跑的 job（默认 fail-fast: true 会这么做，之前 win-x86 失败时就顺带把
      # win-x64 取消掉了，掩盖了 win-x64 本身其实是可以正常发布的）。
      # fail-fast: false — the two RIDs (win-x64/win-x86) are independent; one failing
      # shouldn't cancel the other still-running job (the default fail-fast: true did
      # exactly that when win-x86 failed, hiding the fact that win-x64 itself would have
      # published fine).
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish WPF demo (${{ matrix.rid }})
        run: >
          dotnet publish samples/SevenZipLite.WpfDemo/SevenZipLite.WpfDemo.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.setup.outputs.version }}
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}

      - name: Zip artifact
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath SevenZipLite.WpfDemo-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wpf-demo-${{ matrix.rid }}
          path: SevenZipLite.WpfDemo-${{ matrix.rid }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 5. 构建 MAUI (Android) Demo APK / Build the MAUI (Android) demo APK.
  # ---------------------------------------------------------------------
  build-maui:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android APK (unsigned Release)
        run: >
          dotnet build samples/SevenZipLite.MauiDemo/SevenZipLite.MauiDemo.csproj
          -f net10.0-android -c Release
          -p:Version=${{ needs.setup.outputs.version }}
          -p:AndroidPackageFormat=apk

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk_path=$(find samples/SevenZipLite.MauiDemo -iname "*.apk" | head -n 1)
          echo "找到 / found: $apk_path"
          cp "$apk_path" SevenZipLite.MauiDemo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: maui-demo-apk
          path: SevenZipLite.MauiDemo.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 6. 创建 GitHub Release 并附上所有产物 / Create the GitHub Release with all assets.
  # ---------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    needs: [setup, pack-nuget, publish-wpf, build-maui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release-assets
          find downloaded -type f \( -name "*.nupkg" -o -name "*.snupkg" -o -name "*.zip" -o -name "*.apk" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SevenZipLite v${{ needs.setup.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(needs.setup.outputs.version, '-') }}

  # ---------------------------------------------------------------------
  # 7.（可选，默认不执行）推送到 nuget.org。
  #    (Optional, off by default) Push to nuget.org.
  #    只有仓库 Secrets 中配置了 NUGET_API_KEY 才会运行；用户当前未要求启用此步骤。
  #    Only runs if NUGET_API_KEY is configured in repo Secrets; not requested to be
  #    enabled right now by the maintainer.
  #
  #    注意：job 级（以及 step 级）的 `if:` 条件不允许直接引用 `secrets` 上下文
  #    （GitHub Actions 会在工作流校验阶段报错 "Unrecognized named-value: 'secrets'"，
  #    导致整个工作流文件判定为不合法，一个 job 都跑不起来）。`secrets` 只能出现在
  #    `env:`/`with:` 里。因此这里改用：job 本身总是被调度，但第一步先把 secret 读进
  #    普通 env 变量、判断是否为空并写入 step output，后续步骤的 `if:` 只依赖这个
  #    step output（不是 `secrets` 上下文），从而绕开这个限制。
  #
  #    Note: job-level (and step-level) `if:` conditions cannot directly reference the
  #    `secrets` context (GitHub Actions rejects it at workflow-validation time with
  #    "Unrecognized named-value: 'secrets'", which fails the *entire* workflow file
  #    before any job runs). `secrets` may only appear inside `env:`/`with:`. So this
  #    job always gets scheduled, but its first step reads the secret into a plain env
  #    var, checks whether it's empty, and writes a step output; subsequent steps'
  #    `if:` conditions only depend on that step output (not the `secrets` context),
  #    sidestepping the restriction.
  # ---------------------------------------------------------------------
  publish-nuget-org:
    runs-on: ubuntu-latest
    needs: [pack-nuget, create-release]
    steps:
      - name: Check whether NUGET_API_KEY is configured
        id: check
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "NUGET_API_KEY secret 未配置，跳过 nuget.org 推送 / NUGET_API_KEY secret not set, skipping nuget.org push"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.has_key == 'true'
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.has_key == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Push to nuget.org
        if: steps.check.outputs.has_key == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

